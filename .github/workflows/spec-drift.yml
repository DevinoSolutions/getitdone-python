# The vendored openapi/v1.json is the input to the generated models, so it must
# keep matching the live published document. The TypeScript SDK cannot drift —
# it imports @getitdone/api-contracts at build time — this job is the Python
# equivalent of that guarantee.
name: Spec drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compare the live spec against the vendored copy
        id: drift
        run: |
          set +e
          python scripts/check_spec_drift.py | tee drift-report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open an issue on drift
        if: steps.drift.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search "OpenAPI spec drift in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file drift-report.txt
          else
            gh issue create \
              --title "OpenAPI spec drift: openapi/v1.json is behind production" \
              --body-file drift-report.txt
          fi
